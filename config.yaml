# ASX trading assistant settings. Secrets never go here; they live in .env (gitignored).
# Values under `strategy`, `baseline`, `costs` and `universe` were FROZEN on 2026-09-22,
# before any price data was fetched. Do not change them to improve results.

broker: sim   # sim | paper | live.  live also needs LIVE_TRADING_CONFIRMED=yes in .env

capital:
  # 10000 -> 20000 on 2026-09-23: the account is $20,000. Brokerage is 0.088% with a $6.60
  # minimum, which binds on any position under $7,500, so at 4 positions the cost drag per
  # trade halves (0.53% -> 0.26% round trip). Every result before this date was at $10,000.
  starting_aud: 20000
  max_positions: 4
  # position size = starting_aud / max_positions, equal weight

data:
  provider: yfinance          # yfinance | norgate   (daily history, for backtests)
  dir: data                   # gitignored; copy across manually when moving PCs
  price_history_start: "2003-01-01"
  # Intraday prices for the arena's decisions (day trader scan, v2 reaction looks and rule
  # bot, quotes): ibkr | yfinance. Added 2026-09-24 (replaces arena.intraday_data.provider).
  #   yfinance - Yahoo, ~20 minutes delayed. IB Gateway is never touched.
  #   ibkr     - IBKR real-time through IB Gateway (settings under `ibkr:` below), falling
  #              back to Yahoo by itself whenever Gateway is down, logged out, cut off from
  #              IBKR or sending delayed data - logged, flagged by the live_data self-check,
  #              and each decision records which prices it used (the evening report says).
  # Fills stay simulated from the minute cache either way. Set to ibkr only after
  # `asxbot ibkr check` has passed.
  # 2026-09-24, deliberate change (the pre-set condition, not a result): yfinance -> ibkr
  # once `asxbot ibkr check` passed at 21:35 against the live Gateway (BHP quote frozen/2,
  # BHP bars vs Yahoo, XJO bars; data/arena/ibkr_check.json). Real-time in market hours is
  # re-probed by the feed every 10 minutes, falling back to Yahoo if IBKR sends anything else.
  live_provider: ibkr

# IB Gateway, market data ONLY (src/asxbot/ibkr). Added 2026-09-24. No order call exists in
# that code (a test fails the build if one appears), the connection is read-only, and
# Gateway's "Read-Only API" setting refuses orders at the broker. Pacing: see ibkr/gateway.py.
ibkr:
  host: 127.0.0.1
  port: 4001                  # IB Gateway, live account, API port as set in Gateway
  client_id: 41               # fixed; `asxbot ibkr check` uses 42 so it never clashes
  connect_timeout_s: 10
  request_timeout_s: 20       # one bars request; a whole batch gets twice this
  market_data_lines: 100      # IBKR's default for a new account
  max_quote_lines: 20         # quotes are the only line users; each is cancelled on answer
  max_requests_per_cycle: 90  # historical bar requests a scan (the universe is rotated)
  max_requests_per_10min: 600
  max_concurrent_requests: 8  # IBKR allows 50 open at once
  min_refetch_s: 15           # never the same request twice inside 15 s
  reconnect_every_s: 300      # while on the Yahoo fallback, try Gateway again this often
  quote_wait_s: 3
  generic_ticks: "225"        # 225 = the auction's indicative price, volume and imbalance
  probe_code: BHP             # quoted every 10 min in market hours to confirm real-time

universe:
  frozen_on: "2026-09-22"
  turnover_floor_aud: 250000  # median daily dollar turnover over turnover_window_days
  turnover_window_days: 20
  asx300_source: vas_holdings # current membership only until Norgate (survivorship-biased)

strategy:
  frozen_on: "2026-09-22"
  name: post_announcement_drift
  gap_pct_vs_index: 5.0       # X: (stock open / prev close - 1) - (index open / prev close - 1), in %
  volume_multiple: 3.0        # Y: event-day volume / prior 20-day average volume
  volume_window_days: 20
  entry: next_open            # MAIN RESULT: confirm at day-0 close, enter day-1 open
  entry_upper_bound: same_day_open  # reported only as a labelled optimistic bound
  hold_days: 10               # time exit: sell at open after hold_days sessions
  stop_loss_pct: 8.0          # checked on close, exit at next open
  long_only: true

baseline:
  frozen_on: "2026-09-22"
  name: cross_sectional_momentum
  lookback_months: 12
  skip_months: 1
  top_n: 4                    # same capital, same position count and costs as the strategy
  rebalance: monthly
  regime_index: "^AXJO"
  regime_sma_days: 200

costs:
  frozen_on: "2026-09-22"
  brokerage_pct: 0.088        # IBKR Australia fixed, GST included, each side
  brokerage_min_aud: 6.60
  slippage:
    base_pct: 0.10
    impact_coeff: 0.5         # x (order value / average daily dollar turnover), in %
    cap_pct: 1.0
  slippage_multipliers: [1, 2]   # every backtest is rerun at 2x

backtest:
  holdout_years: 3            # most recent 3 years untouched until parameters frozen
  benchmark_ticker: "STW.AX"  # ASX 200 total-return proxy on yfinance (adjusted close)
  index_ticker: "^AXJO"       # ASX 200 price index
  small_sample_trades: 30     # flag any result resting on fewer trades than this
  data_label_yfinance: "plumbing test - not a go/no-go"

# ---------------------------------------------------------------------------
# SHORT-SIDE STRATEGIES S1 and S2. Written and committed 2026-09-23 BEFORE any run, so the
# history shows the rules came first. Never change them after seeing a result: a change is
# a new dated variant, and counts as another trial (STRATEGIES.md rule 4).
#
# Why shorts: the decider's two strongest ideas on 23 Sep were shorts (NUF, TUA); in A's type
# split, capital-raising announcements averaged -0.97% at $20,000 and rose afterwards about a
# third of the time (reports/phase1_20k.md); and short-selling risk predicts lower returns in
# Australia only outside the top 200, where shares usually cannot be borrowed - so both are
# tested inside the ASX 200 only, the arena's short universe.
#
# Every number below is either A's frozen number reused (so none is chosen here) or stated
# with its reason. Known limits, stated before the run: the ASX 200 list is today's
# membership applied to every past year (survivorship), and S2's idea came from slicing the
# in-sample data, so an in-sample pass is not independent evidence - only the holdout can
# confirm it.
# ---------------------------------------------------------------------------
strategies:
  shorts_common:
    frozen_on: "2026-09-23"
    universe: asx200            # data/universe/asx200_members.csv as of 2026-09-23 (Wikipedia
                                # constituent list), applied to every past year: survivorship
    turnover_floor_aud: 250000  # A's floor: median daily dollar turnover over the prior window
    turnover_window_days: 20
    starting_aud: 20000         # capital.starting_aud
    max_positions: 4            # capital.max_positions; each short sized at equity / 4
    max_gross_short_x_equity: 1.0   # no leverage: no new short if open short value + the new
                                    # one would exceed equity (Level 1's 1.0x)
    min_order_aud: 500          # limits.min_order_aud
    # Costs: A's brokerage and slippage model (costs:), adverse both ways, at 1x and 2x.
    slippage_multipliers: [1, 2]
    # Borrow fee. IBKR Australia's rate for ASX 200 shares could not be sourced: its pricing
    # pages refuse automated reading, and the only figure found is IBKR's illustrative 0.25%
    # a year for a US large cap. So both runs below are ASSUMPTIONS, not sourced numbers.
    borrow_pct_annual: [1.0, 5.0]
    borrow_accrual: "daily, rate x short value at the close x calendar days / 365"
    short_proceeds_interest_pct: 0.0   # none credited: conservative, and A's engine earns none
                                       # on idle cash either
    # Prices are dividend-adjusted (yfinance auto_adjust), so a short pays each dividend
    # implicitly, as it would pay the manufactured dividend on a real borrow.
    stop_check: close           # as A: the stop is tested on the close, covered at the next open
    in_sample_only: true        # stops at the holdout start, the same boundary as Phase 1

  S1_earnings_miss:
    frozen_on: "2026-09-23"
    side: short
    # Trigger: a price-sensitive announcement in the mechanical "results" headline class
    # (announcements/model.py) - the class A's type split used - reacting on session t: the
    # release day if released before 10:00 Sydney, else the next session (A's mapping).
    announcement_type: results
    price_sensitive_only: true
    # Day-0 fall: t's close-to-close return minus the ASX 200's, at or below -5%. A measures
    # its gap at the open; a miss is judged on the whole day's reaction, which is known at
    # the close, when the rule confirms. 5% and 3x are A's numbers, sign reversed.
    fall_measure: close_to_close_vs_index
    fall_pct_vs_index: 5.0
    volume_multiple: 3.0        # t's volume / mean of the prior 20 sessions
    volume_window_days: 20
    entry: next_open            # confirm at t's close, short at t+1's open
    hold_days: 10               # A's hold: cover at the open 10 sessions after entry. A
                                # longer drift horizon is plausible; trying one after seeing
                                # this result would be tuning, so it would be a new variant.
    stop_pct: 8.0               # A's 8%, mirrored: close above entry fill x 1.08 -> cover
                                # at the next open
    priority: highest_volume_multiple   # A's priority when there are more events than slots

  S2_placement_supply:
    frozen_on: "2026-09-23"
    side: short
    # Trigger: a price-sensitive announcement whose headline names a placement. \b keeps out
    # "replacement" (58 ASX 200 headlines); debt placements add no shares, so headlines
    # naming debt, notes, bonds, hybrids or a US private placement are excluded. One event
    # per company per reaction session (A's mapping). Chosen from headline text alone.
    headline_pattern: '\bplacement\b'
    headline_exclude: '\b(debt|notes?|bonds?|hybrids?|uspp)\b|us private placement'
    price_sensitive_only: true
    # Entry: the first open after the release - the reaction session's open. Nothing from
    # that session is needed to decide, so there is no look-ahead.
    entry: reaction_session_open
    # Cover: the thesis is the supply released when placement shares quote. The archive
    # has quotation notices (Appendix 2A, "Application for quotation of securities") only
    # from December 2019, so:
    #   * quotation found: the first such notice by the same company released on or after
    #     the placement's reaction session, within 10 sessions of it. Its reaction session
    #     is the quotation day; cover at the open 5 sessions (a trading week of placees
    #     selling) after it.
    #   * none found - every event before 2020, and any later one without a notice: cover
    #     at the open 10 sessions after entry (A's hold; quotation normally falls inside it).
    quotation_pattern: 'application for quotation|appendix 2a'
    quotation_window_sessions: 10
    cover_after_quotation_sessions: 5
    fallback_hold_days: 10
    stop_pct: 8.0               # A's 8%, mirrored, checked on the close
    priority: highest_prior_turnover    # no volume signal; most liquid first, the cheapest
                                        # to borrow and to trade

collector:
  user_agent: "asx-bot/0.1 (personal research, low volume)"
  request_pause_s: 3.0
  max_retries: 4
  backoff_base_s: 10
  poll_interval_s: 60
  # ASX announcements run 07:30-19:30 Sydney, and to 20:30 during daylight saving.
  # Sydney daylight saving starts the first Sunday in October (4 Oct 2026) and ends the
  # first Sunday in April. The code picks the right end automatically; see arena/hours.py.
  hours: { start: "07:30", end: "19:30", end_dst: "20:30", tz: "Australia/Sydney" }

limits:   # enforced in code by place_order; the agent cannot override these
  # 2500 -> 5000 on 2026-09-23, with capital.starting_aud 10000 -> 20000: the same equal
  # weight, $20,000 / 4 positions. config.py refuses to load a cap below that size.
  max_position_aud: 5000
  # Our own floor, not an ASX rule. The ASX's $500 minimum marketable parcel applies to the
  # first purchase of a company's shares, not to every order: adding to a holding or selling
  # part of one can be smaller. We apply it to every order to stop tiny-order death spirals.
  # Comment corrected 2026-09-23; the value is unchanged.
  min_order_aud: 500
  max_open_positions: 4
  max_new_positions_per_day: 2
  allowed_hours: { start: "10:00", end: "16:00", tz: "Australia/Sydney" }
  long_only: true
  limit_orders_only: true
  allowed_universe: [asx300, small]

# ---------------------------------------------------------------------------
# ARENA — fake money only. See ARENA.md (technical) and PLAN.md (order).
# Every value below was FROZEN on 2026-09-22, before any arena trade was made.
# Do not change them to improve results; change them only as a dated new version.
# ---------------------------------------------------------------------------
arena:
  frozen_on: "2026-09-22"
  # 10000 -> 20000 on 2026-09-23, to match the real account (see capital above). Used only
  # when an account is created; accounts already on disk keep the cash they were opened with.
  starting_aud: 20000          # per account; each playbook has an agent account and a bot account
  enabled: true
  # Added 2026-09-23. What the self-checks expect to be true (arena/selfcheck.py); they
  # run every watcher cycle and shout on Telegram when they are not.
  agents:
    # reader low -> medium on 2026-09-23 (evening), a DELIBERATE CHANGE by Rick, made on the
    # OpenClaw agent itself; the decider's model moved from claude-opus-5 to claude-opus-5-5
    # at the same time (watch.py DECIDER_MODEL), its effort unchanged at high. A model/effort
    # setting, not a tuned parameter and not a finding: no result prompted it. Both confirmed
    # on a live call that evening (winnerModel, requestShaping.thinking). Calls before it ran
    # on Sonnet 5 low / Opus 5 high.
    effort:                    # set on the OpenClaw agents themselves; checked, not applied
      reader: medium
      decider: high
  selfcheck:
    repeat_minutes: 60         # a standing failure is re-alerted at most this often

  alerts:
    telegram: true             # instant alerts: decisions, fills, stops, closes, refusals
    pass_digest_minutes: 60    # passes are not instant: one digest this often instead

  # The aggression ladder (ARENA.md). A playbook sits at exactly one level.
  levels:
    1:
      name: daily
      aim: "profit every day"
      risk_per_trade_pct: 5.0        # distance-to-stop x size, as % of account equity
      # Changed 2026-09-23 to the real-money limits (8 -> 4 positions, 3.0 -> 1.0 leverage).
      # At $20,000, 4 positions is $5,000 each and a 0.26% round trip in brokerage, against
      # 0.53% at 8 positions; strategy A's average trade after costs was +0.05% at $10,000,
      # so the difference is the whole edge and more. And 3x leverage means a 10% adverse
      # move costs 30% of equity in a day, whatever the account size. Levels 2 and 3 are
      # unchanged.
      #
      # Changed 2026-09-24 (evening), a DELIBERATE CHANGE set by Rick in his brief of that
      # evening, not a finding and not tuned: no result prompted it. Position size up to
      # $5,000 (IBKR's $6.60 minimum is then ~0.13% a side), at most 3 open, at most 6 new a
      # day. Was: 4 open, no per-position dollar cap (only the playbook's 40%-of-equity
      # guidance and the $8,000 per-order guard), no daily count. In force from the 25 Sep
      # 07:30 start. The real-money `limits:` above are NOT changed.
      max_open_positions: 3          # per playbook account (was 4)
      max_position_aud: 5000         # per position, entry and adds together (new 2026-09-24)
      max_new_positions_per_day: 6   # opening orders a day, per account (new 2026-09-24)
      leverage_asx: 1.0
      leverage_crypto: 10.0          # unused until a crypto playbook starts
      daily_loss_limit_pct: 15.0     # then no NEW positions until tomorrow; exits stay allowed
      holding: intraday              # overnight only with a written reason
      wake_sensitivity: most
    2:
      name: weekly
      aim: "profit every week"
      risk_per_trade_pct: 2.0
      max_open_positions: 6
      leverage_asx: 1.5
      leverage_crypto: 3.0
      daily_loss_limit_pct: 8.0
      holding: days
      wake_sensitivity: medium
    3:
      name: monthly
      aim: "profit every month"
      risk_per_trade_pct: 1.0
      max_open_positions: 5
      leverage_asx: 1.0
      leverage_crypto: 1.0
      daily_loss_limit_pct: 4.0
      holding: weeks
      wake_sensitivity: standard

  # Hard safety guards, not strategy parameters. They exist so a loop or a confused
  # agent cannot churn the account; they are deliberately far above normal activity.
  guards:
    max_orders_per_day: 40           # per account
    max_order_value_aud: 8000        # per single order, whatever leverage allows
    # Our own floor on every arena order, not an ASX rule: the ASX's $500 minimum
    # marketable parcel applies only to an initial purchase in a company. Comment corrected
    # 2026-09-23; the value is unchanged.
    min_order_aud: 500
    allowed_hours: { start: "07:00", end: "19:30", end_dst: "20:30", tz: "Australia/Sydney" }

  # Deferred fills (decided 2026-09-22 with Rick).
  # Free quotes are ~20 minutes delayed, so the true price at the moment of a decision is
  # not knowable when the decision is made. Every arena order is therefore recorded as
  # pending with its decision timestamp and filled later, from the 1-minute bar covering
  # that minute. If the stock did not trade in that minute, the fill walks FORWARD to the
  # next minute that did trade - never to an earlier one. Same rule for stops and exits.
  fill:
    minute_price: close      # close | typical | open, of the first traded minute bar that
                             # STARTS strictly after the order was recorded (decided_at).
                             # Until 2026-09-23 it was the bar containing the decision
                             # minute, and the decision time was stale (TRACKER #24). A
                             # comment change only; the value is unchanged.
    max_wait_minutes: 390    # give up if no traded minute is found within one session
    resolve_after_minutes: 22  # don't try to resolve a fill until the free feed has caught up
    stop_gap_rule: worse_of  # a stop fills at the stop price, or at the bar open if the
                             # bar opened through it (a gap) - whichever is worse for us
    # Added 2026-09-23 evening, in force from the 24 Sep 07:30 start (TRACKER #25). A DELIBERATE CHANGE to the fill model, not a finding
    # and not tuned: no minute bar fills more than this share of the shares it traded; the
    # rest carries to later bars at their prices. Until now a bar filled any size - A1M's
    # 3,000-share take-profit (ARN-000003) filled in a bar where 1 share traded. 20% is the
    # figure Rick set; it was not chosen by looking at any result. Per account, per ticker,
    # per bar; a stop exit gets the volume first, then a target exit, then everything else.
    # A day order still part-filled when its session ends is done ("partial"); a stop or
    # target exit keeps working into the next session (broker.work has the full rule).
    max_volume_share: 0.20
    # Added 2026-09-23 evening, with #25 (TRACKER #26). A bar is used only once it is final: it traded, it has
    # ended, and it is not the newest row of an intraday fetch - Yahoo appends the minute
    # still forming as a zero-volume placeholder and rewrites it; nothing was seen to change
    # after the next row appeared (minutes.final_bars). This many extra minutes behind the
    # newest row are also held back; 0, because no evidence asks for more. ASX bars were not
    # polled during a session; if they are seen to change, raise it here, dated.
    settle_minutes: 0
    # Added 2026-09-23 night, in force from the 24 Sep 07:30 start (TRACKER #28). A DELIBERATE
    # CHANGE to the fill model, approved by Rick on 23 Sep, not a finding and not tuned: an
    # order "at the open" fills at the ASX opening auction price, which is what a real order
    # at the open gets. The 1-minute feed leaves the auction out, so until now such an order
    # filled at the close of the first traded minute after it. `daily_open` prices the auction
    # at Yahoo's daily open (checked, not confirmed against the ASX: reports/auction_open_check.md
    # and minutes.opening_auction); `first_minute` restores the old rule. An order joins the
    # auction if recorded before 09:59:00; so does a stop or target the auction price reaches.
    opening_auction: daily_open
    # No more than this share of the auction's estimated volume (Yahoo's daily volume less the
    # day's minute volumes - an upper bound, as it also holds off-market trades) fills in the
    # auction; the rest carries into the minute bars. 0.20 is Rick's bar figure reused, not
    # chosen by looking at any result. CONFIRMED by Rick 2026-09-23 22:20 AEST (in chat),
    # value unchanged. Auction fills keep the costs.slippage base (0.10%), as the frozen
    # backtest's open fills do - also confirmed 2026-09-23, unchanged.
    auction_volume_share: 0.20
    # How long past the open plus resolve_after_minutes to wait for Yahoo's daily bar before
    # giving up on the day's auction (10:52 with the 22-minute delay). Nothing in the ticker is
    # worked while it waits. Then the orders fill at the first traded minute, labelled.
    auction_wait_minutes: 30

  # Level 1 is an intraday level: positions are closed before the 16:10 close unless the
  # decider writes a reason to hold. The sweep asks it about each open position, so the
  # reason is written at the close - not assumed from what it intended hours earlier.
  # Added 2026-09-23. An announcement released before the open is judged without the one
  # thing that matters most: what the market did with it. Both A1M announcements were
  # passed on pre-open with the stated blocker being that the 10:00 auction had not
  # happened. Each such pass now gets ONE second look after the auction has settled, with
  # the opening move against the index and the volume against the 20-day average visible.
  # Re-looks are logged as re-looks, and still face the screen and both reader gates.
  relook:
    time: "10:20"

  preclose:
    sweep_time: "15:50"      # Sydney; must leave time for the fill before 16:10
    close_deadline: "16:10"  # the ASX closing auction

  costs:
    # Slippage reuses costs.slippage above (base 0.10% + 0.5 x value/ADV, capped 1.0%).
    # That base ALREADY stands in for the bid-ask spread, so no separate spread is added;
    # it is replaced by real IBKR quotes when the formal test starts.
    short_borrow_pct_annual: 3.0   # ASX 200 borrow estimate, charged daily on short value

  shorts:
    asx_universe: asx200     # ASX shorts allowed only in the realistic borrowable set
    crypto_requires_futures: true

  telegram:
    evening_report_time: "19:30"
    evening_report_time_dst: "20:30"   # announcements run an hour later on daylight saving
    tz: "Australia/Sydney"

  # Playbooks. Only ONE is tested at a time (PLAN.md). Numbers are ARENA.md labels.
  # The arena's intraday data (added 2026-09-24). Where the prices come from is one line,
  # data.live_provider (ibkr | yfinance, top of this file). On Yahoo every decision is made
  # on delayed 1-minute bars and every report says "delayed data - rehearsal until IBKR
  # live prices"; on IBKR the report counts which prices each decision used.
  intraday_data:
    # The feed switch moved to data.live_provider on 2026-09-24 (ibkr | yfinance).
    # Yahoo's ASX bars arrive about this far behind the market. Used ONLY by the plumbing
    # replay, to decide which bars a decision could have seen; the live watcher uses the
    # bars the feed actually holds at the moment it decides, whatever the delay is.
    feed_delay_minutes: 20
    # Requests to Yahoo per scan cycle, at most. The liquid universe is ~250 stocks; one
    # request per stock every minute is ~15,000 an hour, which risks Yahoo refusing the
    # whole machine (fills included). So each cycle refreshes the stalest stocks first, up
    # to this many, and each stock is seen every few minutes. A refusal halves it for the
    # rest of the day and is alerted.
    max_requests_per_cycle: 90
    # Prior sessions used for "usual volume at this time of day" (1-minute history on the
    # free feed is ~7 days). Fewer than min_sessions cached: no baseline, and no setup or
    # reaction test that needs one.
    baseline_sessions: 5
    baseline_min_sessions: 3

  playbooks:
    # -------------------------------------------------------------------------------------
    # VERSION 1 of the announcements playbook, RETIRED 2026-09-24 (evening) by Rick's brief:
    # "Two days of a design that barely trades is not a test." Every value below is version
    # 1's, kept as it ran (23-24 Sep 2026) so the record stays readable. Its accounts
    # (asx_announcements__agent, __bot) are kept on disk and no longer traded; neither held
    # a position when it was retired. Version 2 is `asx_announcements_v2` below.
    # -------------------------------------------------------------------------------------
    asx_announcements:
      arena_id: 2
      title: "ASX announcements (v1, retired 2026-09-24)"
      market: asx
      level: 1
      version: 1
      enabled: false            # retired 2026-09-24; was true
      retired_on: "2026-09-24"
      status: retired           # build | shakedown | warmup | test | passed | retired (was warmup)
      warmup_start: "2026-09-23T07:30:00+10:00"
      # Holding, set 2026-09-23. The level's default is intraday, which put the agent in a
      # different race from its own yardstick: the 15:50 sweep flattened the agent every
      # day while the bot held 10 sessions. At 09:58 the decider passed on A1M and said so
      # itself - "the yardstick bot will likely take this and may well beat me, because its
      # 10-session horizon captures M&A drift that an intraday position cannot". The agent
      # now gets the same horizon as the thing it is measured against. The yardstick's own
      # frozen rule (below) is untouched.
      holding: days
      hold_sessions: 10         # same as the yardstick's hold_days; code closes at this
      data_basis: "free delayed quotes; fills deferred to the true minute bar"
      # The agent's trigger: every price-sensitive announcement above the liquidity floor.
      trigger:
        price_sensitive_only: true
        turnover_floor_aud: 250000
        # Added 2026-09-23 after the first warm-up morning: one ASX tick worth more than
        # this much of the price makes a stock untradeable whatever the news says, so it
        # is rejected in plain code before any model is called (arena/tradability.py).
        #
        # Raised 1.0 -> 3.0 on 2026-09-23. At 1.0 this was arithmetically a 50c price
        # floor: ASX ticks are 0.1c below 10c, 0.5c to $2 and 1c above, so 1% excluded
        # every stock under 50c and bound nothing at all above $2. It caused 32 of the 47
        # screen rejections that morning. 3.0 admits everything above about 17c.
        # This is a DELIBERATE, DATED LOOSENING to get the arena trading and to see what
        # the agent does with a real flow of announcements. It is not a tuned result, and
        # nothing about it was chosen by looking at returns.
        max_tick_pct: 3.0
      # Starting guidance for the agent (it may deviate, and must write down why).
      guidance:
        default_exit: same_day
        shorts_allowed_in: asx200
        max_position_pct_of_equity: 40.0
      # The rule-based yardstick: strategy A, already built and backtested.
      yardstick:
        name: announcement_drift_A
        # Added 2026-09-23 evening, in force from the 24 Sep yardstick run (TRACKER #27). A DELIBERATE DATA CHANGE, not a tuned parameter:
        # the rule is "gap vs the index at the open", and Yahoo's daily ^AXJO open equals the
        # previous close on most days, so the live yardstick was measuring a raw gap. It now
        # takes the index's open from its 10:00 minute bar (checked 14-23 Sep 2026 against
        # the cap-weighted opening gap of ~195 members: mean error 0.12 points, against 0.40
        # for Yahoo's daily open and 0.17-0.23 for ASX 200 ETF opens). No 10:00 bar = the
        # day is missed and recorded, never a fallback. `daily` restores the old behaviour.
        # The FROZEN BACKTEST is unchanged and still uses the daily open (see TRACKER #27).
        index_open: first_minute_bar
        gap_pct_vs_index: 5.0
        volume_multiple: 3.0
        hold_days: 10
        stop_loss_pct: 8.0
        long_only: true

    # -------------------------------------------------------------------------------------
    # VERSION 2 of the announcements playbook. FROZEN 2026-09-24 (evening), written here
    # BEFORE it ran, from Rick's brief of that evening. Its 10-trading-day Level 1 test
    # starts 25 Sep 2026 (PLAN.md: only a failed test steps down to Weekly). A change to
    # anything below after it has run is a new dated version, scored separately.
    #
    # The idea: trade the REACTION, not the news. The agent still gets its pre-open look at
    # overnight news; then it decides on each stock with price-sensitive news once the market
    # has traded it for 10-30 minutes, from what the market did (move against the ASX 200,
    # volume against the stock's usual volume at that time of day, the opening auction
    # price) and the news. Holds are intraday; everything is flat by the pre-close sweep.
    # -------------------------------------------------------------------------------------
    asx_announcements_v2:
      arena_id: 2
      title: "ASX announcements v2 (trade the reaction)"
      market: asx
      level: 1
      version: 2
      frozen_on: "2026-09-24"
      enabled: true
      status: test
      test_start: "2026-09-25"   # day 1 of 10 (v2); the evening report counts from here
      test_days: 10
      # New accounts, $20,000 each (arena.starting_aud): v2's record starts clean.
      accounts: asx_announcements_v2
      holding: intraday
      # Flat by the pre-close sweep at arena.preclose.sweep_time (15:50): code closes every
      # position without asking - no overnight holds in v2, so the agent and its rule bot run
      # the same race. (v1's sweep asked the decider for a written reason to hold.)
      preclose: flat
      # No new opening orders after this wall-clock time, and an entry still unfilled by
      # then stops filling: with the delayed feed a later fill would not be visible to the
      # sweep before the 16:10 close.
      last_entry_time: "15:40"
      data_basis: "delayed data - rehearsal until IBKR live prices"
      screen:
        # Kept from v1: a halt or suspension notice is out. (A reinstatement passes, as in v1.)
        halt_headlines: true
        # Kept from v1: one tick worth more than this % of the price is out.
        max_tick_pct: 3.0
        # REPLACES v1's fixed $250,000 turnover floor: a stock is tradeable if our order is
        # under this share of its median daily dollar turnover over the last 20 sessions.
        # Screened at the largest order the level allows (max_position_aud, $5,000), so
        # the floor is $100,000 a day; arena_place_order also refuses any order above it.
        max_order_share_of_turnover: 0.05
        turnover_window_days: 20
        # Kept from v1: no live quote = out. The ticker is written to
        # data/arena/no_quote/<day>.json for the IBKR data fix.
        no_quote: true
        # REPLACES v1's "no trades by 10:30" test, which read a volume the quote never
        # returned (24 Sep day review): halted = the minute bars show no trade in the
        # 10 minutes after the news reached the market (see reaction below).
        halted_if_no_trade_minutes: 10
      reader:
        # The reader still writes CAN_SIZE_AND_EXIT, but in v2 it no longer stops a stock:
        # liquidity is the screen's arithmetic above. TRADE_WORTHY still gates the PRE-OPEN
        # look only; the reaction look below is asked whatever the reader said, because v2
        # trades what the market does with the news.
        can_size_gate: false
      pre_open_look: true        # as v1: news before 10:00 is judged before the open
      relook: false              # v1's 10:20 re-look is replaced by the reaction look
      reaction:
        # One look per stock per day. The news "reaches the market" at the first traded
        # minute at or after max(its release, 10:00) - the open for overnight news, the
        # resumption after the price-sensitive pause for news during the session.
        # News counts from the previous session's 16:10 close. The look happens once the
        # feed's final bars reach 10 minutes after that, and must start before they reach
        # 40 minutes after it; otherwise it is recorded as missed. For overnight news that
        # is Rick's 10:10-10:40 window in MARKET time. On the ~20-minute delayed feed the
        # wall clock then reads about 10:32-11:02; with IBKR live data the two coincide.
        after_minutes: 10
        before_minutes: 40
        # Wake the decider only for a reaction worth a look: |move vs ASX 200| >= 1.0% OR
        # volume >= 2x the stock's usual volume over the same minutes. The rest are logged
        # as quiet, not asked. Written before the first run; not tuned.
        wake_move_vs_index_pct: 1.0
        wake_volume_multiple: 2.0
        # Most interesting first when several are due: |move vs index| x volume multiple.
        order_by: move_x_volume
      # The decider's question in v2 (watch.py, the v2 packet): "over the rest of today, is
      # the expected move in this direction bigger than about 0.4% after costs, and where
      # is the stop?" - not "is the news mispriced".
      decider:
        min_expected_net_move_pct: 0.4
      guidance:
        default_exit: same_day
        shorts_allowed_in: asx200
      # The rule bot (yardstick) for v2, written before it ran. No model. Same costs, fill
      # rules and level limits as the agent.
      yardstick:
        name: announcement_reaction_v2
        # A stock with price-sensitive news today (released after the previous session's
        # 16:10 close and before 10:30) that at 10:30 is up >= 3% against the ASX 200 on
        # >= 3x its usual first-30-minute volume is BOUGHT at 10:31, stop at the low of
        # 10:00-10:30, exit 15:55. Mirror: an ASX 200 member down >= 3% against the index
        # on >= 3x is SHORTED, stop at the 10:00-10:30 high.
        #   move at 10:30 = (close of the 10:29 bar / previous close - 1)
        #                 - (^AXJO close of its 10:29 bar / ^AXJO previous close - 1), in %
        #   previous close = the previous session's last minute bar (its 16:10 closing
        #     auction, which equals Yahoo's daily close on 348 of 348 days checked)
        #   first-30-minute volume = the sum of the 10:01-10:29 minute bars' volume.
        #     CORRECTED 2026-09-24, BEFORE ANY RUN (was "10:00-10:29", on the belief that the
        #     auction is never in the minute feed): Yahoo's 10:00 bar holds the opening
        #     auction's volume on some stock-days and nothing on others (17-24 Sep, 300 codes:
        #     171 first bars over 10x the next ten bars' median, a median 3.9% of the day's
        #     volume, against 892 with none). Counting it would make "usual" depend on which
        #     days Yahoo included the auction. Every volume measure in v2 and the day trader
        #     starts at 10:01 (arena/intraday.py VOLUME_FROM). No rule had been run.
        #   usual = the mean of the same sum over the prior sessions in the minute cache
        #     (intraday_data.baseline_sessions, at least baseline_min_sessions)
        #   stop = the lowest low (highest high for a short) of the 10:00-10:29 bars
        move_vs_index_pct: 3.0
        volume_multiple: 3.0
        measure_at: "10:30"
        exit_at: "15:55"
        # "Bought at 10:31" means the first bar after the decision. On the delayed feed the
        # decision can only be made once the 10:29 bar is final, ~10:52 by the wall clock,
        # so it fills then; with IBKR live data, at 10:31. A decision not made by this wall
        # time is recorded as missed, never taken late.
        latest_decision_time: "11:15"
        # Sizing: the level's max position ($5,000) within its limits, capped by the 5%-of-
        # turnover rule; screens as the agent's (tick, halt, turnover, quote).
        size_aud: 5000
        # More signals than free slots (3 open, 6 a day): highest volume multiple first.
        priority: highest_volume_multiple
        # The entry is a limit this far through the last visible price, so it behaves like a
        # marketable order but never fills at any price.
        entry_limit_slack_pct: 2.0

    # -------------------------------------------------------------------------------------
    # DAY-TRADER playbook, VERSION 1. FROZEN 2026-09-24 (evening), written here BEFORE it
    # ran, from Rick's brief of that evening ("why can't it be doing the work of a day
    # trader"). Its own $20,000 agent account and its own rule bot. Level 1 test of 10 ASX
    # trading days from 25 Sep 2026. Every rule below is exact; a change after it has run is
    # a new dated version.
    #
    # DATA HONESTY: Yahoo's ASX 1-minute bars are ~20 minutes delayed. Decisions use only
    # the bars the feed holds at the moment of the decision; a fill is the first bar that
    # starts after the order is recorded, so on the delayed feed a setup is entered ~20
    # minutes after the bar that triggered it. Every report says "delayed data - rehearsal
    # until IBKR live prices". data.live_provider switches the feed (from 2026-09-24).
    # -------------------------------------------------------------------------------------
    asx_daytrader:
      arena_id: 12
      title: "ASX day trader"
      market: asx
      level: 1
      version: 1
      frozen_on: "2026-09-24"
      enabled: true
      status: test
      test_start: "2026-09-25"
      test_days: 10
      accounts: asx_daytrader_v1
      holding: intraday
      preclose: flat             # flat by the 15:50 pre-close sweep, no overnight holds
      data_basis: "delayed data - rehearsal until IBKR live prices"
      # Risk per trade, |entry - stop| x shares, at most 0.5% of equity (the level allows 5%).
      risk_per_trade_pct: 0.5
      universe:
        # The liquid universe: ASX 300 names whose median daily dollar turnover over the
        # last 20 sessions is at least 20x the largest order (the same 5% size-aware rule as
        # v2), and whose tick is at most max_tick_pct of the price (a setup's stop is often
        # 1-3% away; a coarser tick makes it meaningless). Built once each morning.
        base: asx300
        max_order_share_of_turnover: 0.05
        turnover_window_days: 20
        max_tick_pct: 1.0
      scan:
        # SCANNED IN CODE every cycle (the watcher polls every 60 s) in market time
        # 10:00-15:45 - the time of the newest final bar - across the liquid universe:
        # movers against the ASX 200, volume against the usual volume by this minute, new
        # intraday highs and lows, halt resumptions, and stocks with price-sensitive news
        # today. Each cycle's top lists go to the event log (daytrader_scan).
        start: "10:00"
        end: "15:45"
        top_n: 10
      # No new entry after this WALL time: later fills could not be seen by the sweep.
      last_entry_time: "15:40"
      # A setup is acted on only if its trigger bar is at most this many bars older than the
      # newest bar the feed holds for that stock (each stock is refreshed every few minutes).
      max_signal_age_bars: 5
      # Each (stock, setup, direction) triggers at most once a day.
      setups:
        # Definitions shared by the setups:
        #   previous close  = the previous session's last minute bar (its closing auction)
        #   open            = the open of the day's first traded minute bar (Yahoo's
        #                     10:00 bar carries the auction print on some days and not on
        #                     others; against the auction the median gap is 0.30%, TRACKER #28)
        #   index open      = ^AXJO's 10:00 bar open (TRACKER #27)
        #   RVOL at bar t   = volume from 10:01 through t / the mean of the same over the
        #                     prior sessions (intraday_data.baseline_*). From 10:01, not
        #                     10:00: corrected 2026-09-24 before any run, as v2's volume above
        #   VWAP at bar t   = sum(typical price x volume) / sum(volume), 10:00 through t,
        #                     typical = (high + low + close) / 3
        #   long rules below; the SHORT mirror (every inequality reversed, highs <-> lows) is
        #   allowed only for the dated ASX 200 list (arena.shorts)
        gap_and_go:
          # gap vs index = (open / previous close - 1) - (index open / index previous close
          # - 1) >= 3%; the first bar from 10:15 to 10:45 that CLOSES above the high of the
          # 10:00-10:14 bars, while no bar since the open has traded below the previous
          # close (the gap is not filled), with RVOL >= 2.0 at that bar.
          # Stop (invalidation): the low of the 10:00-10:14 bars.
          gap_pct_vs_index: 3.0
          range_minutes: 15
          window: ["10:15", "10:45"]
          min_rvol: 2.0
        opening_range_breakout:
          # The first bar from 10:30 to 14:30 that CLOSES above the high of the 10:00-10:29
          # bars, on rising volume: that bar's volume >= 2x the mean volume of the 10 bars
          # before it, and RVOL >= 1.5.
          # Stop: the midpoint of the 10:00-10:29 range (a breakout that falls back halfway
          # into the range has failed; the far side would put +2R out of reach on most days).
          range_minutes: 30
          window: ["10:30", "14:30"]
          bar_volume_multiple: 2.0
          bar_volume_lookback: 10
          min_rvol: 1.5
        vwap_reclaim:
          # Trend intact: at the prior bar the stock is up >= 1.0% against the ASX 200 since
          # the previous close, and VWAP is higher than 30 bars earlier. Pullback: at least
          # 3 of the last 20 bars before this one closed below VWAP, the last of them being
          # the prior bar. Reclaim: this bar, between 10:45 and 15:15, CLOSES above VWAP, on
          # volume >= the mean of the 20 bars before it. (Short mirror: "VWAP loss".)
          # Stop: the lowest low of the last 15 bars, this one included.
          window: ["10:45", "15:15"]
          min_move_vs_index_pct: 1.0
          vwap_slope_bars: 30
          pullback_lookback: 20
          min_bars_below: 3
          bar_volume_lookback: 20
          stop_lookback: 15
        halt_resumption:
          # A halt: 10 or more minutes with no trade, after 10:05 and before 15:30, in a
          # stock that traded in at least 80% of the 30 minutes before the gap; or a first
          # trade of the day at or after 10:30 on a day with a reinstatement or a
          # price-sensitive announcement for it. The resumption range is the first 10 minutes
          # of trading after it. Continuation: the resumption move (close of the 10th minute
          # against the last price before the halt - the previous close for a late start)
          # is >= +2% against the index's move over the same time, and within 60 minutes a
          # bar CLOSES above the resumption range's high. Stop: the resumption range's low.
          min_gap_minutes: 10
          prior_activity_share: 0.8
          late_first_trade: "10:30"
          resumption_range_minutes: 10
          min_move_vs_index_pct: 2.0
          within_minutes: 60
      entry:
        # A limit this far through the last visible price (above it for a buy), rounded to
        # the tick; it stops filling 10 minutes after it is recorded (a stale setup).
        limit_slack_pct: 1.0
        good_for_minutes: 10
        # Size: shares = min(risk budget / |entry - stop|, max_position_aud / entry,
        # max_order_share_of_turnover x median turnover / entry), whole shares.
      manage:
        # Code manages every position, agent's and bot's alike, bar by bar in the broker
        # (the stop only ever tightens; a move is effective from the next bar):
        #   R = |average fill - the stop it opened with|
        #   the best price since entry reaches +1R: the stop moves to breakeven (the average
        #     fill, before costs)
        #   it reaches +2R: half the shares are sold at +2R (a resting take-profit, filled
        #     like any target), and from then the stop trails 1R behind the best price
        #   a stop that is reached exits whatever is left; everything is flat at 15:50
        breakeven_at_r: 1.0
        half_at_r: 2.0
        trail_at_r: 2.0
        trail_distance_r: 1.0
      # One re-entry per stock per day: after a first trade in a stock has closed, one more
      # entry in it that day, on a new trigger. Never while a position or entry is working.
      max_entries_per_stock_per_day: 2
      agent:
        # The AGENT (trader-decider) confirms or rejects each code-found setup: one call per
        # setup, with the context a trader checks (the news, the market's direction, the
        # stock's industry move, how extended it is from VWAP and the open, where the stop
        # goes). No answer within 60 s is a rejection. It may tighten the stop, never widen
        # it; code sizes the order and enforces the stop.
        timeout_s: 60
      yardstick:
        # The RULE BOT takes every setup mechanically, sized and managed the same way,
        # through the same limits. Several at once: highest RVOL first.
        name: daytrader_setups_v1
        priority: highest_rvol
