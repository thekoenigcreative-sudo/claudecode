# ASX trading assistant settings. Secrets never go here; they live in .env (gitignored).
# Values under `strategy`, `baseline`, `costs` and `universe` were FROZEN on 2026-09-22,
# before any price data was fetched. Do not change them to improve results.

broker: sim   # sim | paper | live.  live also needs LIVE_TRADING_CONFIRMED=yes in .env

capital:
  # 10000 -> 20000 on 2026-09-23: the account is $20,000. Brokerage is 0.088% with a $6.60
  # minimum, which binds on any position under $7,500, so at 4 positions the cost drag per
  # trade halves (0.53% -> 0.26% round trip). Every result before this date was at $10,000.
  starting_aud: 20000
  max_positions: 4
  # position size = starting_aud / max_positions, equal weight

data:
  provider: yfinance          # yfinance | norgate
  dir: data                   # gitignored; copy across manually when moving PCs
  price_history_start: "2003-01-01"

universe:
  frozen_on: "2026-09-22"
  turnover_floor_aud: 250000  # median daily dollar turnover over turnover_window_days
  turnover_window_days: 20
  asx300_source: vas_holdings # current membership only until Norgate (survivorship-biased)

strategy:
  frozen_on: "2026-09-22"
  name: post_announcement_drift
  gap_pct_vs_index: 5.0       # X: (stock open / prev close - 1) - (index open / prev close - 1), in %
  volume_multiple: 3.0        # Y: event-day volume / prior 20-day average volume
  volume_window_days: 20
  entry: next_open            # MAIN RESULT: confirm at day-0 close, enter day-1 open
  entry_upper_bound: same_day_open  # reported only as a labelled optimistic bound
  hold_days: 10               # time exit: sell at open after hold_days sessions
  stop_loss_pct: 8.0          # checked on close, exit at next open
  long_only: true

baseline:
  frozen_on: "2026-09-22"
  name: cross_sectional_momentum
  lookback_months: 12
  skip_months: 1
  top_n: 4                    # same capital, same position count and costs as the strategy
  rebalance: monthly
  regime_index: "^AXJO"
  regime_sma_days: 200

costs:
  frozen_on: "2026-09-22"
  brokerage_pct: 0.088        # IBKR Australia fixed, GST included, each side
  brokerage_min_aud: 6.60
  slippage:
    base_pct: 0.10
    impact_coeff: 0.5         # x (order value / average daily dollar turnover), in %
    cap_pct: 1.0
  slippage_multipliers: [1, 2]   # every backtest is rerun at 2x

backtest:
  holdout_years: 3            # most recent 3 years untouched until parameters frozen
  benchmark_ticker: "STW.AX"  # ASX 200 total-return proxy on yfinance (adjusted close)
  index_ticker: "^AXJO"       # ASX 200 price index
  small_sample_trades: 30     # flag any result resting on fewer trades than this
  data_label_yfinance: "plumbing test - not a go/no-go"

# ---------------------------------------------------------------------------
# SHORT-SIDE STRATEGIES S1 and S2. Written and committed 2026-09-23 BEFORE any run, so the
# history shows the rules came first. Never change them after seeing a result: a change is
# a new dated variant, and counts as another trial (STRATEGIES.md rule 4).
#
# Why shorts: the decider's two strongest ideas on 23 Sep were shorts (NUF, TUA); in A's type
# split, capital-raising announcements averaged -0.97% at $20,000 and rose afterwards about a
# third of the time (reports/phase1_20k.md); and short-selling risk predicts lower returns in
# Australia only outside the top 200, where shares usually cannot be borrowed - so both are
# tested inside the ASX 200 only, the arena's short universe.
#
# Every number below is either A's frozen number reused (so none is chosen here) or stated
# with its reason. Known limits, stated before the run: the ASX 200 list is today's
# membership applied to every past year (survivorship), and S2's idea came from slicing the
# in-sample data, so an in-sample pass is not independent evidence - only the holdout can
# confirm it.
# ---------------------------------------------------------------------------
strategies:
  shorts_common:
    frozen_on: "2026-09-23"
    universe: asx200            # data/universe/asx200_members.csv as of 2026-09-23 (Wikipedia
                                # constituent list), applied to every past year: survivorship
    turnover_floor_aud: 250000  # A's floor: median daily dollar turnover over the prior window
    turnover_window_days: 20
    starting_aud: 20000         # capital.starting_aud
    max_positions: 4            # capital.max_positions; each short sized at equity / 4
    max_gross_short_x_equity: 1.0   # no leverage: no new short if open short value + the new
                                    # one would exceed equity (Level 1's 1.0x)
    min_order_aud: 500          # limits.min_order_aud
    # Costs: A's brokerage and slippage model (costs:), adverse both ways, at 1x and 2x.
    slippage_multipliers: [1, 2]
    # Borrow fee. IBKR Australia's rate for ASX 200 shares could not be sourced: its pricing
    # pages refuse automated reading, and the only figure found is IBKR's illustrative 0.25%
    # a year for a US large cap. So both runs below are ASSUMPTIONS, not sourced numbers.
    borrow_pct_annual: [1.0, 5.0]
    borrow_accrual: "daily, rate x short value at the close x calendar days / 365"
    short_proceeds_interest_pct: 0.0   # none credited: conservative, and A's engine earns none
                                       # on idle cash either
    # Prices are dividend-adjusted (yfinance auto_adjust), so a short pays each dividend
    # implicitly, as it would pay the manufactured dividend on a real borrow.
    stop_check: close           # as A: the stop is tested on the close, covered at the next open
    in_sample_only: true        # stops at the holdout start, the same boundary as Phase 1

  S1_earnings_miss:
    frozen_on: "2026-09-23"
    side: short
    # Trigger: a price-sensitive announcement in the mechanical "results" headline class
    # (announcements/model.py) - the class A's type split used - reacting on session t: the
    # release day if released before 10:00 Sydney, else the next session (A's mapping).
    announcement_type: results
    price_sensitive_only: true
    # Day-0 fall: t's close-to-close return minus the ASX 200's, at or below -5%. A measures
    # its gap at the open; a miss is judged on the whole day's reaction, which is known at
    # the close, when the rule confirms. 5% and 3x are A's numbers, sign reversed.
    fall_measure: close_to_close_vs_index
    fall_pct_vs_index: 5.0
    volume_multiple: 3.0        # t's volume / mean of the prior 20 sessions
    volume_window_days: 20
    entry: next_open            # confirm at t's close, short at t+1's open
    hold_days: 10               # A's hold: cover at the open 10 sessions after entry. A
                                # longer drift horizon is plausible; trying one after seeing
                                # this result would be tuning, so it would be a new variant.
    stop_pct: 8.0               # A's 8%, mirrored: close above entry fill x 1.08 -> cover
                                # at the next open
    priority: highest_volume_multiple   # A's priority when there are more events than slots

  S2_placement_supply:
    frozen_on: "2026-09-23"
    side: short
    # Trigger: a price-sensitive announcement whose headline names a placement. \b keeps out
    # "replacement" (58 ASX 200 headlines); debt placements add no shares, so headlines
    # naming debt, notes, bonds, hybrids or a US private placement are excluded. One event
    # per company per reaction session (A's mapping). Chosen from headline text alone.
    headline_pattern: '\bplacement\b'
    headline_exclude: '\b(debt|notes?|bonds?|hybrids?|uspp)\b|us private placement'
    price_sensitive_only: true
    # Entry: the first open after the release - the reaction session's open. Nothing from
    # that session is needed to decide, so there is no look-ahead.
    entry: reaction_session_open
    # Cover: the thesis is the supply released when placement shares quote. The archive
    # has quotation notices (Appendix 2A, "Application for quotation of securities") only
    # from December 2019, so:
    #   * quotation found: the first such notice by the same company released on or after
    #     the placement's reaction session, within 10 sessions of it. Its reaction session
    #     is the quotation day; cover at the open 5 sessions (a trading week of placees
    #     selling) after it.
    #   * none found - every event before 2020, and any later one without a notice: cover
    #     at the open 10 sessions after entry (A's hold; quotation normally falls inside it).
    quotation_pattern: 'application for quotation|appendix 2a'
    quotation_window_sessions: 10
    cover_after_quotation_sessions: 5
    fallback_hold_days: 10
    stop_pct: 8.0               # A's 8%, mirrored, checked on the close
    priority: highest_prior_turnover    # no volume signal; most liquid first, the cheapest
                                        # to borrow and to trade

collector:
  user_agent: "asx-bot/0.1 (personal research, low volume)"
  request_pause_s: 3.0
  max_retries: 4
  backoff_base_s: 10
  poll_interval_s: 60
  # ASX announcements run 07:30-19:30 Sydney, and to 20:30 during daylight saving.
  # Sydney daylight saving starts the first Sunday in October (4 Oct 2026) and ends the
  # first Sunday in April. The code picks the right end automatically; see arena/hours.py.
  hours: { start: "07:30", end: "19:30", end_dst: "20:30", tz: "Australia/Sydney" }

limits:   # enforced in code by place_order; the agent cannot override these
  # 2500 -> 5000 on 2026-09-23, with capital.starting_aud 10000 -> 20000: the same equal
  # weight, $20,000 / 4 positions. config.py refuses to load a cap below that size.
  max_position_aud: 5000
  # Our own floor, not an ASX rule. The ASX's $500 minimum marketable parcel applies to the
  # first purchase of a company's shares, not to every order: adding to a holding or selling
  # part of one can be smaller. We apply it to every order to stop tiny-order death spirals.
  # Comment corrected 2026-09-23; the value is unchanged.
  min_order_aud: 500
  max_open_positions: 4
  max_new_positions_per_day: 2
  allowed_hours: { start: "10:00", end: "16:00", tz: "Australia/Sydney" }
  long_only: true
  limit_orders_only: true
  allowed_universe: [asx300, small]

# ---------------------------------------------------------------------------
# ARENA — fake money only. See ARENA.md (technical) and PLAN.md (order).
# Every value below was FROZEN on 2026-09-22, before any arena trade was made.
# Do not change them to improve results; change them only as a dated new version.
# ---------------------------------------------------------------------------
arena:
  frozen_on: "2026-09-22"
  # 10000 -> 20000 on 2026-09-23, to match the real account (see capital above). Used only
  # when an account is created; accounts already on disk keep the cash they were opened with.
  starting_aud: 20000          # per account; each playbook has an agent account and a bot account
  enabled: true
  # Added 2026-09-23. What the self-checks expect to be true (arena/selfcheck.py); they
  # run every watcher cycle and shout on Telegram when they are not.
  agents:
    # reader low -> medium on 2026-09-23 (evening), a DELIBERATE CHANGE by Rick, made on the
    # OpenClaw agent itself; the decider's model moved from claude-opus-5 to claude-opus-5-5
    # at the same time (watch.py DECIDER_MODEL), its effort unchanged at high. A model/effort
    # setting, not a tuned parameter and not a finding: no result prompted it. Both confirmed
    # on a live call that evening (winnerModel, requestShaping.thinking). Calls before it ran
    # on Sonnet 5 low / Opus 5 high.
    effort:                    # set on the OpenClaw agents themselves; checked, not applied
      reader: medium
      decider: high
  selfcheck:
    repeat_minutes: 60         # a standing failure is re-alerted at most this often

  alerts:
    telegram: true             # instant alerts: decisions, fills, stops, closes, refusals
    pass_digest_minutes: 60    # passes are not instant: one digest this often instead

  # The aggression ladder (ARENA.md). A playbook sits at exactly one level.
  levels:
    1:
      name: daily
      aim: "profit every day"
      risk_per_trade_pct: 5.0        # distance-to-stop x size, as % of account equity
      # Changed 2026-09-23 to the real-money limits (8 -> 4 positions, 3.0 -> 1.0 leverage).
      # At $20,000, 4 positions is $5,000 each and a 0.26% round trip in brokerage, against
      # 0.53% at 8 positions; strategy A's average trade after costs was +0.05% at $10,000,
      # so the difference is the whole edge and more. And 3x leverage means a 10% adverse
      # move costs 30% of equity in a day, whatever the account size. Levels 2 and 3 are
      # unchanged.
      max_open_positions: 4          # per playbook account
      leverage_asx: 1.0
      leverage_crypto: 10.0          # unused until a crypto playbook starts
      daily_loss_limit_pct: 15.0     # then no NEW positions until tomorrow; exits stay allowed
      holding: intraday              # overnight only with a written reason
      wake_sensitivity: most
    2:
      name: weekly
      aim: "profit every week"
      risk_per_trade_pct: 2.0
      max_open_positions: 6
      leverage_asx: 1.5
      leverage_crypto: 3.0
      daily_loss_limit_pct: 8.0
      holding: days
      wake_sensitivity: medium
    3:
      name: monthly
      aim: "profit every month"
      risk_per_trade_pct: 1.0
      max_open_positions: 5
      leverage_asx: 1.0
      leverage_crypto: 1.0
      daily_loss_limit_pct: 4.0
      holding: weeks
      wake_sensitivity: standard

  # Hard safety guards, not strategy parameters. They exist so a loop or a confused
  # agent cannot churn the account; they are deliberately far above normal activity.
  guards:
    max_orders_per_day: 40           # per account
    max_order_value_aud: 8000        # per single order, whatever leverage allows
    # Our own floor on every arena order, not an ASX rule: the ASX's $500 minimum
    # marketable parcel applies only to an initial purchase in a company. Comment corrected
    # 2026-09-23; the value is unchanged.
    min_order_aud: 500
    allowed_hours: { start: "07:00", end: "19:30", end_dst: "20:30", tz: "Australia/Sydney" }

  # Deferred fills (decided 2026-09-22 with Rick).
  # Free quotes are ~20 minutes delayed, so the true price at the moment of a decision is
  # not knowable when the decision is made. Every arena order is therefore recorded as
  # pending with its decision timestamp and filled later, from the 1-minute bar covering
  # that minute. If the stock did not trade in that minute, the fill walks FORWARD to the
  # next minute that did trade - never to an earlier one. Same rule for stops and exits.
  fill:
    minute_price: close      # close | typical | open, of the first traded minute bar that
                             # STARTS strictly after the order was recorded (decided_at).
                             # Until 2026-09-23 it was the bar containing the decision
                             # minute, and the decision time was stale (TRACKER #24). A
                             # comment change only; the value is unchanged.
    max_wait_minutes: 390    # give up if no traded minute is found within one session
    resolve_after_minutes: 22  # don't try to resolve a fill until the free feed has caught up
    stop_gap_rule: worse_of  # a stop fills at the stop price, or at the bar open if the
                             # bar opened through it (a gap) - whichever is worse for us
    # Added 2026-09-23 evening, in force from the 24 Sep 07:30 start (TRACKER #25). A DELIBERATE CHANGE to the fill model, not a finding
    # and not tuned: no minute bar fills more than this share of the shares it traded; the
    # rest carries to later bars at their prices. Until now a bar filled any size - A1M's
    # 3,000-share take-profit (ARN-000003) filled in a bar where 1 share traded. 20% is the
    # figure Rick set; it was not chosen by looking at any result. Per account, per ticker,
    # per bar; a stop exit gets the volume first, then a target exit, then everything else.
    # A day order still part-filled when its session ends is done ("partial"); a stop or
    # target exit keeps working into the next session (broker.work has the full rule).
    max_volume_share: 0.20
    # Added 2026-09-23 evening, with #25 (TRACKER #26). A bar is used only once it is final: it traded, it has
    # ended, and it is not the newest row of an intraday fetch - Yahoo appends the minute
    # still forming as a zero-volume placeholder and rewrites it; nothing was seen to change
    # after the next row appeared (minutes.final_bars). This many extra minutes behind the
    # newest row are also held back; 0, because no evidence asks for more. ASX bars were not
    # polled during a session; if they are seen to change, raise it here, dated.
    settle_minutes: 0

  # Level 1 is an intraday level: positions are closed before the 16:10 close unless the
  # decider writes a reason to hold. The sweep asks it about each open position, so the
  # reason is written at the close - not assumed from what it intended hours earlier.
  # Added 2026-09-23. An announcement released before the open is judged without the one
  # thing that matters most: what the market did with it. Both A1M announcements were
  # passed on pre-open with the stated blocker being that the 10:00 auction had not
  # happened. Each such pass now gets ONE second look after the auction has settled, with
  # the opening move against the index and the volume against the 20-day average visible.
  # Re-looks are logged as re-looks, and still face the screen and both reader gates.
  relook:
    time: "10:20"

  preclose:
    sweep_time: "15:50"      # Sydney; must leave time for the fill before 16:10
    close_deadline: "16:10"  # the ASX closing auction

  costs:
    # Slippage reuses costs.slippage above (base 0.10% + 0.5 x value/ADV, capped 1.0%).
    # That base ALREADY stands in for the bid-ask spread, so no separate spread is added;
    # it is replaced by real IBKR quotes when the formal test starts.
    short_borrow_pct_annual: 3.0   # ASX 200 borrow estimate, charged daily on short value

  shorts:
    asx_universe: asx200     # ASX shorts allowed only in the realistic borrowable set
    crypto_requires_futures: true

  telegram:
    evening_report_time: "19:30"
    evening_report_time_dst: "20:30"   # announcements run an hour later on daylight saving
    tz: "Australia/Sydney"

  # Playbooks. Only ONE is tested at a time (PLAN.md). Numbers are ARENA.md labels.
  playbooks:
    asx_announcements:
      arena_id: 2
      title: "ASX announcements"
      market: asx
      level: 1
      enabled: true
      status: warmup            # build | shakedown | warmup | test | passed | retired
      warmup_start: "2026-09-23T07:30:00+10:00"
      # Holding, set 2026-09-23. The level's default is intraday, which put the agent in a
      # different race from its own yardstick: the 15:50 sweep flattened the agent every
      # day while the bot held 10 sessions. At 09:58 the decider passed on A1M and said so
      # itself - "the yardstick bot will likely take this and may well beat me, because its
      # 10-session horizon captures M&A drift that an intraday position cannot". The agent
      # now gets the same horizon as the thing it is measured against. The yardstick's own
      # frozen rule (below) is untouched.
      holding: days
      hold_sessions: 10         # same as the yardstick's hold_days; code closes at this
      data_basis: "free delayed quotes; fills deferred to the true minute bar"
      # The agent's trigger: every price-sensitive announcement above the liquidity floor.
      trigger:
        price_sensitive_only: true
        turnover_floor_aud: 250000
        # Added 2026-09-23 after the first warm-up morning: one ASX tick worth more than
        # this much of the price makes a stock untradeable whatever the news says, so it
        # is rejected in plain code before any model is called (arena/tradability.py).
        #
        # Raised 1.0 -> 3.0 on 2026-09-23. At 1.0 this was arithmetically a 50c price
        # floor: ASX ticks are 0.1c below 10c, 0.5c to $2 and 1c above, so 1% excluded
        # every stock under 50c and bound nothing at all above $2. It caused 32 of the 47
        # screen rejections that morning. 3.0 admits everything above about 17c.
        # This is a DELIBERATE, DATED LOOSENING to get the arena trading and to see what
        # the agent does with a real flow of announcements. It is not a tuned result, and
        # nothing about it was chosen by looking at returns.
        max_tick_pct: 3.0
      # Starting guidance for the agent (it may deviate, and must write down why).
      guidance:
        default_exit: same_day
        shorts_allowed_in: asx200
        max_position_pct_of_equity: 40.0
      # The rule-based yardstick: strategy A, already built and backtested.
      yardstick:
        name: announcement_drift_A
        # Added 2026-09-23 evening, in force from the 24 Sep yardstick run (TRACKER #27). A DELIBERATE DATA CHANGE, not a tuned parameter:
        # the rule is "gap vs the index at the open", and Yahoo's daily ^AXJO open equals the
        # previous close on most days, so the live yardstick was measuring a raw gap. It now
        # takes the index's open from its 10:00 minute bar (checked 14-23 Sep 2026 against
        # the cap-weighted opening gap of ~195 members: mean error 0.12 points, against 0.40
        # for Yahoo's daily open and 0.17-0.23 for ASX 200 ETF opens). No 10:00 bar = the
        # day is missed and recorded, never a fallback. `daily` restores the old behaviour.
        # The FROZEN BACKTEST is unchanged and still uses the daily open (see TRACKER #27).
        index_open: first_minute_bar
        gap_pct_vs_index: 5.0
        volume_multiple: 3.0
        hold_days: 10
        stop_loss_pct: 8.0
        long_only: true
