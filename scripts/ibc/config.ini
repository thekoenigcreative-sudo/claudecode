# IBC settings for the asx-bot IB Gateway (IBC 3.24.2). The launcher, scripts/ibgateway.pyw,
# copies this file to C:\IBC\asxbot\config.ini at every start; change it here, not there.
# Every setting IBC knows is documented in C:\IBC\config.ini (IBC's own sample).
#
# NO LOGIN IN THIS FILE, EVER. IbLoginId and IbPassword stay blank: the launcher reads Rick's
# login from Windows Credential Manager (ibkr_login_setup.cmd stores it) and hands it to IBC
# as arguments. If none is stored, Gateway opens its login window for Rick.
# (IBC's sample has IbLoginId=edemo / IbPassword=demouser; blank here on purpose.)

IbLoginId=
IbPassword=
FIX=no
TradingMode=live

# The phone approval (IBKR Mobile / IB Key). IBKR requires it for every full login; nothing
# can skip it. If it is not given within IBKR's 180 s, IBC exits (code 1111) and the launcher
# logs in again, sending a new approval - at most 3 times in a row (TwoFactorTimeoutAction
# = restart, capped so an unanswered phone is not pinged all night).
ReloginAfterSecondFactorAuthenticationTimeout=yes
SecondFactorAuthenticationExitInterval=60
SecondFactorAuthenticationTimeout=180
SecondFactorDevice=
LoginDialogDisplayTimeout=60

# Another login with Rick's username (IBKR Mobile, Client Portal, TWS) must not knock this
# Gateway off for good: 'primary' keeps this session and takes it back if told to end.
ExistingSessionDetectedAction=primary

# The API: live port 4001, localhost only (Gateway's TrustedIPs=127.0.0.1), READ-ONLY - the
# broker-side lock against orders - and any other API client that asks is refused.
OverrideTwsApiPort=4001
ReadOnlyApi=yes
ReadOnlyLogin=no
AcceptIncomingConnectionAction=reject
AllowBlindTrading=no
TrustedTwsApiClientIPs=

# Gateway restarts itself daily at 23:45 without a new login (valid until IBKR's weekly
# full re-authentication). No logoff, no closedown.
AutoRestartTime=11:45 PM
AutoLogoffTime=
ColdRestartTime=
ClosedownAt=
IbAutoClosedown=no

IbDir=
StoreSettingsOnServer=
MinimizeMainWindow=yes
AcceptNonBrokerageAccountWarning=no
DismissPasswordExpiryWarning=no
DismissNSEComplianceNotice=yes

# IBC's command server stays off: nothing can send IBC commands over the network.
CommandServerPort=0
ControlFrom=
BindAddress=
CommandPrompt=
SuppressInfoMessages=yes
LogStructureScope=known
LogStructureWhen=never
