[project]
name = "asxbot"
version = "0.1.0"
description = "Personal ASX trading assistant: post-announcement drift, sim broker, human approval on every order."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "yfinance>=0.2.40",
    "pyyaml>=6",
    "python-dotenv>=1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "exchange_calendars>=4.5",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pytest-cov>=5"]
ibkr = ["ib_async>=1.0"]
norgate = ["norgatedata>=1.0"]

[project.scripts]
asxbot = "asxbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
